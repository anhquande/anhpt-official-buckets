name: Build and release workout bucket

on:
  pull_request_target:
    types:
      - closed
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-workout-bucket
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Delete merged branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          gh api \
            --method DELETE \
            "repos/${GITHUB_REPOSITORY}/git/refs/heads/${HEAD_REF}"

  release:
    if: >-
      github.event.pull_request.merged == true &&
      (startsWith(github.event.pull_request.title, 'feat:') ||
       startsWith(github.event.pull_request.title, 'fix:'))
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Generate workout media
        shell: bash
        run: |
          shopt -s nullglob
          for generator in main/*/generate_media.py; do
            python "$generator"
          done

      - name: Choose release tag
        shell: bash
        run: echo "RELEASE_TAG=bucket-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build packages and catalog
        shell: bash
        run: |
          python scripts/build_bucket.py \
            --release-tag "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY"

      - name: Commit generated catalog
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add main/bucket.json

          if ! git diff --cached --quiet; then
            git commit -m "chore: prepare ${RELEASE_TAG} [skip ci]"
            git push origin HEAD:main
          fi

          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Create GitHub Release and upload packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          assets=(dist/*.anhpt.zip)

          if [ ${#assets[@]} -eq 0 ]; then
            echo "No .anhpt.zip assets were built" >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_SHA" \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi

      - name: Refresh download counts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/update_download_counts.py

      - name: Commit refreshed download counts
        shell: bash
        run: |
          git add main/bucket.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update download counts for ${RELEASE_TAG} [skip ci]"
            git push origin HEAD:main
          fi
