name: Update workout download stats

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

concurrency:
  group: update-workout-download-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update download counts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/update_download_counts.py

      - name: Commit catalog stats
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main/bucket.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update workout download stats [skip ci]"
            git push origin HEAD:main
          fi
